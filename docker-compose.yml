name: ndtech-isp-management

services:
  mysql:
    image: mysql:8.4
    container_name: isp_mysql_docker
    restart: unless-stopped
    env_file:
      - .env.docker
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
    ports:
      - "3308:3306"
    volumes:
      - mysql_docker_data:/var/lib/mysql
    healthcheck:
      test:
        [
          "CMD",
          "mysqladmin",
          "ping",
          "-h",
          "localhost",
          "-p${MYSQL_ROOT_PASSWORD}",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  redis:
    image: redis:7.4-alpine
    container_name: isp_redis_docker
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_docker_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: docker/api.Dockerfile.dev
    container_name: isp_api_docker
    restart: unless-stopped
    env_file:
      - .env.docker
    environment:
      DOCKER_ENV: "true"
      CHOKIDAR_USEPOLLING: "true"
      WATCHPACK_POLLING: "true"
    ports:
      - "4000:4000"
    volumes:
      - .:/app
      - api_node_modules:/app/node_modules
      - api_app_node_modules:/app/apps/api/node_modules
    depends_on:
      mysql:
        condition: service_healthy
    entrypoint: ["sh", "/app/docker/api-entrypoint.dev.sh"]

  web:
    build:
      context: .
      dockerfile: docker/web.Dockerfile.dev
    container_name: isp_web_docker
    restart: unless-stopped
    env_file:
      - .env.docker
    environment:
      DOCKER_ENV: "true"
      WATCHPACK_POLLING: "true"
    ports:
      - "3001:3001"
    volumes:
      - .:/app
      - web_node_modules:/app/node_modules
      - web_app_node_modules:/app/apps/web/node_modules
    depends_on:
      - api
    command: ["npm", "run", "dev:web:docker"]

volumes:
  mysql_docker_data:
  redis_docker_data:
  api_node_modules:
  api_app_node_modules:
  web_node_modules:
  web_app_node_modules:
