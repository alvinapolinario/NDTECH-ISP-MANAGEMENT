name: ndtech_collector
description: NDTECH ISP field collector app with hybrid online/offline sync.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.2.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  connectivity_plus: ^6.1.4
  flutter_secure_storage: ^9.2.4
  http: ^1.2.2
  intl: ^0.19.0
  path: ^1.9.0
  provider: ^6.1.2
  sqflite: ^2.4.1
  uuid: ^4.5.1
  esc_pos_utils: ^1.1.0
  print_bluetooth_thermal: ^1.1.6
  shared_preferences: ^2.3.3
  mobile_scanner: ^6.0.2
  permission_handler: ^11.4.0
  device_info_plus: ^11.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/logo/
    - assets/images/logo/logo.PNG
